workflows:
  gbm-servicios-android:
    name: GBM Servicios Android Workflow (Mac M2)
    instance_type: mac_mini_m2
    working_directory: GBM_SERVICIOS
    environment:
      vars:
        PACKAGE_NAME: "com.tuempresa.clips"
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - GBM_SERVICIOS/build/app/outputs/flutter-apk/*.apk
